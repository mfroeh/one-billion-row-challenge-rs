[package]
name = "one-billion-row-challenge-rs"
version = "0.1.0"
edition = "2024"

[profile.profiling]
inherits = "release"
debug = true

[dependencies]
libc = "0.2.186"
memchr = "2.8.3"
ptr_hash = "2.0.2"
rustc-hash = { version = "2.1.3" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"

[[bin]]
name = "verify"
path = "bin/verify.rs"
