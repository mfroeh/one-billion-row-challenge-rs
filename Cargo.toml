[package]
name = "one-billion-row-challenge"
version = "0.1.0"
edition = "2024"

[profile.profiling]
inherits = "release"
debug = true

[dependencies]
libc = "0.2.186"
memchr = "2.8.3"
rand = "0.10.4"
rand_distr = "0.6.0"
rustc-hash = { version = "2.1.3" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"

[[bin]]
name = "verify"
path = "bin/verify.rs"

[[bin]]
name = "generate"
path = "bin/generate.rs"
